# Copy this file to config.yaml and edit it. config.yaml is gitignored.

platform:
  # rnk-rpi service base URL
  base_url: "http://192.168.1.20:5000"
  request_timeout_s: 10
  # true = 640x480 snapshot, false = full 1920x1080
  snapshot_scaled: true
  # after scheduling a move/rotate, poll GET /rnk/schedule until it's done
  poll_interval_s: 0.5
  poll_timeout_s: 60

llm:
  # LM Studio's OpenAI-compatible server (Developer tab -> "Start Server")
  base_url: "http://localhost:1234/v1"
  # "auto" = ask LM Studio for /v1/models and use the first one listed.
  # Set an exact id (as shown by `curl http://localhost:1234/v1/models`
  # or the LM Studio UI) if you want a specific model instead.
  model: "auto"
  # LM Studio doesn't check this, but the API shape requires some value
  api_key: "lm-studio"
  temperature: 0.7
  max_tokens: 1800
  request_timeout_s: 120

audio_stream:
  # rnk-rpi's continuous audio-capture TCP stream (see rnk-rpi's
  # app/audio/capture_constants.py - sample_rate/channels/sample_width must
  # match what's configured there)
  host: "192.168.1.20"
  port: 5001
  sample_rate: 16000
  channels: 1
  sample_width: 2
  connect_timeout_s: 5.0
  reconnect_interval_s: 2.0

vad:
  # webrtcvad aggressiveness: 0 (least aggressive, more false positives)
  # .. 3 (most aggressive) - 3 filters out background noise (footsteps,
  # appliance humming, ...) much better than lower settings
  aggressiveness: 3
  frame_ms: 20
  # rolling buffer kept before speech is detected, so an utterance keeps
  # the audio right before it was flagged as speech
  pre_roll_ms: 300
  # consecutive speech-classified audio needed to trigger an utterance start
  # - kept generous so brief noise bursts (a footstep, a door) don't start one
  speech_start_ms: 300
  # minimum loudness (dBFS, 0 = full scale) for a frame to ever count as
  # speech, regardless of what webrtcvad says - filters out quiet but
  # broadband background noise (appliance humming, etc.) a sensitive mic
  # picks up. Raise (toward 0) if quiet noise still triggers false starts;
  # lower (more negative) if quiet speech is being ignored.
  min_speech_dbfs: -40.0
  # consecutive silence needed to finalize an utterance - keep this
  # generous enough that a short mid-sentence pause doesn't cut it short
  silence_hangover_ms: 800
  # safety cap so a single utterance can't grow unbounded
  max_utterance_s: 30

stt:
  engine: "faster-whisper"
  model_size: "base"
  # "ru", "en", ... or "" to auto-detect
  language: "ru"
  device: "cpu"
  compute_type: "int8"

loop:
  # pause between iterations once a command has finished
  interval_s: 1.0
  # extra pause after any ptz_absolute/ptz_relative/ptz_home action, since
  # the platform can report "not moving" slightly before the camera has
  # actually visually settled
  camera_settle_extra_s: 1.0
  # 0 = run forever
  max_iterations: 0
  # per-iteration snapshots + raw LLM I/O get dropped here for debugging
  log_dir: "logs"
  # todo.json / observations.json (agent-writable scratch state) live here
  state_dir: "state"
  system_prompt_path: "prompts/system_prompt.txt"
  # sub-prompts substituted into the %%TODO%%/%%OBSERVATIONS%%/%%CAMERA%%/
  # %%TIME%% placeholders of system_prompt_path (each becomes "" if that
  # section has nothing to show, e.g. an empty todo list)
  todo_section_path: "prompts/sections/todo.txt"
  observations_section_path: "prompts/sections/observations.txt"
  camera_section_path: "prompts/sections/camera.txt"
  time_section_path: "prompts/sections/time.txt"
